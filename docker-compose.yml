services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2885351
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backfid_refont
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fid
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 2885351
    volumes:
      - photos:/app/photos
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./eIDbffront
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  photos:
